<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="grad-VT-RETAIL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow-VT-RETAIL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#grad-VT-RETAIL)"/>
  
  <!-- Ambient Pattern -->
  <circle cx="650" cy="150" r="90" fill="none" stroke="rgba(96,165,250,0.15)" stroke-width="3"/>
              <circle cx="150" cy="300" r="70" fill="none" stroke="rgba(96,165,250,0.15)" stroke-width="2"/>
  
  <!-- Center Glow -->
  <circle cx="400" cy="180" r="140" fill="url(#glow-VT-RETAIL)"/>

  <!-- Icon Container -->
  <g transform="translate(360, 140) scale(3.5)" filter="url(#shadow)">
    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(40, 40)">
    <rect width="90" height="32" rx="8" fill="#ffffff" fill-opacity="0.95"/>
    <text x="45" y="21" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#0f172a" text-anchor="middle">VT-RETAIL</text>
  </g>

  <g transform="translate(760, 40)">
    <rect x="-180" width="180" height="32" rx="8" fill="#0b4f34" fill-opacity="0.9"/>
    <text x="-90" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">KISS VOCATIONAL</text>
  </g>

  <!-- Bottom Details Overlay -->
  <rect y="320" width="800" height="130" fill="#000000" fill-opacity="0.45"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  
  <!-- Title & Subtitle -->
  <text x="40" y="365" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="#ffffff">Retail & Small Business</text>
  <text x="40" y="398" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#60a5fa">Store Merchandising & POS Operations</text>
  <text x="760" y="398" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0" text-anchor="end">Practical Lab Training</text>
</svg>