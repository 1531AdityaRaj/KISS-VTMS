<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="grad-VT-3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow-VT-3D" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#grad-VT-3D)"/>
  
  <!-- Ambient Pattern -->
  <polygon points="400,60 700,225 400,390 100,225" fill="none" stroke="rgba(74,222,128,0.15)" stroke-width="2"/>
  
  <!-- Center Glow -->
  <circle cx="400" cy="180" r="140" fill="url(#glow-VT-3D)"/>

  <!-- Icon Container -->
  <g transform="translate(360, 140) scale(3.5)" filter="url(#shadow)">
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" fill="none" stroke="#4ade80" stroke-width="2"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96" fill="none" stroke="#4ade80" stroke-width="1.5"/>
              <line x1="12" y1="22.08" x2="12" y2="12" stroke="#4ade80" stroke-width="1.5"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(40, 40)">
    <rect width="90" height="32" rx="8" fill="#ffffff" fill-opacity="0.95"/>
    <text x="45" y="21" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#0f172a" text-anchor="middle">VT-3D</text>
  </g>

  <g transform="translate(760, 40)">
    <rect x="-180" width="180" height="32" rx="8" fill="#0b4f34" fill-opacity="0.9"/>
    <text x="-90" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">KISS VOCATIONAL</text>
  </g>

  <!-- Bottom Details Overlay -->
  <rect y="320" width="800" height="130" fill="#000000" fill-opacity="0.45"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  
  <!-- Title & Subtitle -->
  <text x="40" y="365" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="#ffffff">3D Printing & CAD</text>
  <text x="40" y="398" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#4ade80">Additive Design & Prototyping</text>
  <text x="760" y="398" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0" text-anchor="end">Practical Lab Training</text>
</svg>